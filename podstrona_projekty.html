<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Szczegóły Projektu</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/ScrollTrigger.min.js"></script>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700;900&display=swap" rel="stylesheet">
    
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f0f0f0;
            color: #1a1a1a;
        }
        #transition-overlay {
            position: fixed;
            inset: 0;
            background-color: #f0f0f0;
            z-index: 9999;
        }
        .gallery-image {
            width: 100%;
            height: auto;
            object-fit: cover;
            border-radius: 0.5rem;
            transition: transform 0.3s ease, filter 0.3s ease;
        }
        .gallery-image:hover {
            transform: scale(1.03);
            filter: brightness(1.1);
        }
        #ambient-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
        }
        #custom-cursor {
            position: fixed;
            left: 0;
            top: 0;
            width: 24px;
            height: 24px;
            border: 2px solid black;
            border-radius: 50%;
            pointer-events: none;
            transform: translate(-50%, -50%);
            transition: transform 0.2s ease-out, background-color 0.2s ease-out, border-color 0.2s ease-out;
            z-index: 1000;
            display: none;
        }

        @media (pointer: fine) {
            body, a, button {
                cursor: none;
            }
            #custom-cursor {
                display: block;
            }
        }

        #custom-cursor.grow {
            transform: translate(-50%, -50%) scale(2);
            background-color: black;
            border-color: transparent;
        }

        @keyframes float {
            0% { transform: translateY(0px); }
            50% { transform: translateY(-8px); }
            100% { transform: translateY(0px); }
        }

        .tech-tag {
            animation: float 6s ease-in-out infinite;
        }
    </style>
</head>
<body class="antialiased">

    <div id="transition-overlay"></div>
    <div id="custom-cursor"></div>
    <canvas id="ambient-canvas"></canvas>

    <header class="p-4 sm:p-8">
        <nav class="flex justify-between items-center text-lg max-w-7xl mx-auto">
            <a href="portfolio.html" class="font-bold text-2xl z-50 page-transition-link">TwojeLogo.</a>
            <a href="portfolio.html#kontakt" class="page-transition-link hidden md:inline-block bg-black text-white px-6 py-2 rounded-full hover:bg-gray-800 transition-colors">
                Kontakt
            </a>
            <a href="portfolio.html" class="page-transition-link md:hidden font-bold z-50">Powrót</a>
        </nav>
    </header>

    <main class="py-16 sm:py-24 overflow-hidden">
        <div class="max-w-7xl mx-auto px-4 sm:px-8">
            
            <div class="text-center mb-16 animate-on-scroll">
                <h1 id="project-title" class="text-5xl sm:text-7xl font-black tracking-tighter"></h1>
                <p id="project-category" class="mt-4 text-xl text-gray-500"></p>
            </div>

            <div class="mb-16 animate-on-scroll">
                <img id="project-main-image" src="" alt="Główny obrazek projektu" class="w-full h-auto rounded-lg shadow-lg">
            </div>

            <div class="grid grid-cols-1 md:grid-cols-3 gap-12 animate-on-scroll">
                <div class="md:col-span-2">
                    <h2 class="text-3xl font-bold mb-4">O Projekcie</h2>
                    <div id="project-description" class="text-lg text-gray-700 leading-relaxed space-y-4">
                    </div>
                </div>
                <div>
                    <h2 class="text-3xl font-bold mb-4">Technologie</h2>
                    <div id="project-technologies" class="flex flex-wrap gap-2">
                        <!-- Kontener na tagi -->
                    </div>
                </div>
            </div>
            
            <div class="mt-16 animate-on-scroll">
                <h2 class="text-3xl font-bold mb-8 text-center">Galeria</h2>
                <div id="project-gallery" class="grid grid-cols-1 sm:grid-cols-2 gap-8">
                </div>
            </div>

        </div>
    </main>

    <footer class="text-center p-8 mt-16 text-gray-500">
        <p>Portfolio &copy; 2024</p>
    </footer>

    <script>
        document.addEventListener('DOMContentLoaded', () => {

            gsap.registerPlugin(ScrollTrigger);

            // --- BAZA DANYCH PROJEKTÓW ---
            const projectsData = {
                '1': {
                    title: 'Aplikacja do śledzenia budżetu',
                    category: 'Frontend, Aplikacja Webowa, Narzędzia',
                    mainImage: 'Zrzut ekranu 2025-10-08 151215.png',
                    description: `
                        <p>Budget Tracker to w pełni funkcjonalna aplikacja webowa stworzona w czystym JavaScript, która działa całkowicie offline. Pozwala użytkownikom na monitorowanie swoich przychodów i wydatków bez potrzeby połączenia z internetem, zapisując wszystkie dane bezpiecznie w lokalnej pamięci przeglądarki (LocalStorage).</p>
                        <p>Aplikacja oferuje intuicyjny interfejs do dodawania, edytowania i usuwania transakcji. Kluczowe funkcje to dynamiczne filtrowanie i wyszukiwanie danych, a także wizualizacja finansów za pomocą interaktywnych wykresów (kołowego i słupkowego) z wykorzystaniem biblioteki Chart.js. Dodatkowo, projekt umożliwia łatwy import i eksport danych w formacie CSV, co zapewnia pełną kontrolę nad informacjami. Całość jest w pełni responsywna i posiada przełącznik motywu (jasny/ciemny).</p>
                    `,
                    technologies: ['HTML', 'CSS', 'JavaScript (ES6+)', 'Chart.js', 'LocalStorage API'],
                    gallery: [
                        'Zrzut ekranu 2025-10-08 151241.png',
                        'Zrzut ekranu 2025-10-08 151302.png',
                    ]
                },
                '2': {
                    title: 'Inna Realizacja',
                    category: 'Branding, Aplikacja Mobilna',
                    mainImage: 'https://placehold.co/1200x600/e2e8f0/333?text=Projekt+2',
                    description: `
                        <p>Projekt polegał na kompleksowym rebrandingu marki oraz zaprojektowaniu i wdrożeniu aplikacji mobilnej na platformy iOS i Android.</p>
                        <p>Skupiłem się na stworzeniu spójnego i intuicyjnego interfejsu użytkownika, który odzwierciedla nowe wartości marki. Aplikacja została napisana w React Native.</p>
                    `,
                    technologies: ['React Native', 'Firebase', 'Figma', 'Lottie'],
                     gallery: [
                        'https://placehold.co/800x600/cbd5e1/333?text=Galeria+2A',
                        'https://placehold.co/800x600/94a3b8/333?text=Galeria+2B',
                    ]
                },
                '3': {
                    title: 'Sklep E-commerce',
                    category: 'UX/UI, Frontend',
                    mainImage: 'https://placehold.co/1200x600/e2e8f0/333?text=Projekt+3',
                    description: `
                        <p>Zadanie polegało na zaprojektowaniu od podstaw interfejsu sklepu internetowego oraz zakodowaniu frontendu w oparciu o framework Next.js.</p>
                        <p>Priorytetem była szybkość ładowania strony i optymalizacja pod kątem SEO. Zintegrowałem sklep z systemem płatności Stripe.</p>
                    `,
                    technologies: ['Next.js', 'React', 'Tailwind CSS', 'Stripe API', 'Vercel'],
                     gallery: [
                        'https://placehold.co/800x600/cbd5e1/333?text=Galeria+3A',
                        'https://placehold.co/800x600/94a3b8/333?text=Galeria+3B',
                    ]
                }
            };

            const params = new URLSearchParams(window.location.search);
            const projectId = params.get('id');
            const project = projectsData[projectId];

            if (project) {
                document.title = project.title + ' - Szczegóły Projektu';
                document.getElementById('project-title').textContent = project.title;
                document.getElementById('project-category').textContent = project.category;
                document.getElementById('project-main-image').src = project.mainImage;
                document.getElementById('project-main-image').alt = project.title;
                document.getElementById('project-description').innerHTML = project.description;
                
                const techContainer = document.getElementById('project-technologies');
                project.technologies.forEach(tech => {
                    const span = document.createElement('span');
                    span.className = 'tech-tag bg-white text-black font-semibold px-4 py-2 rounded-full shadow-sm';
                    span.textContent = tech;
                    span.style.animationDelay = `${Math.random() * 5}s`;
                    techContainer.appendChild(span);
                });

                const gallery = document.getElementById('project-gallery');
                project.gallery.forEach(imgSrc => {
                    const img = document.createElement('img');
                    img.src = imgSrc;
                    img.alt = "Zdjęcie z galerii projektu";
                    img.className = "gallery-image";
                    gallery.appendChild(img);
                });

            } else {
                document.getElementById('project-title').textContent = 'Nie znaleziono projektu';
            }

            const transitionOverlay = document.getElementById('transition-overlay');
            gsap.to(transitionOverlay, { 
                y: '-100%', 
                duration: 1, 
                ease: 'power3.inOut',
            });
            
            document.querySelectorAll('.page-transition-link').forEach(link => {
                link.addEventListener('click', (e) => {
                    e.preventDefault();
                    const href = link.getAttribute('href');
                    gsap.to(transitionOverlay, {
                        y: '0%',
                        duration: 1,
                        ease: 'power3.inOut',
                        onComplete: () => {
                            window.location.href = href;
                        }
                    });
                });
            });

            document.querySelectorAll('.animate-on-scroll').forEach(elem => {
                gsap.fromTo(elem, 
                    { opacity: 0, y: 50 },
                    {
                        opacity: 1,
                        y: 0,
                        duration: 1,
                        ease: 'power3.out',
                        scrollTrigger: {
                            trigger: elem,
                            start: 'top 85%',
                            toggleActions: 'play reverse play reverse'
                        }
                    }
                );
            });

            const cursor = document.getElementById('custom-cursor');
            if (cursor && window.matchMedia("(pointer: fine)").matches) {
                const interactiveElements = document.querySelectorAll('a, button, .tech-tag');
                gsap.set(cursor, { xPercent: -50, yPercent: -50 });
                const pos = { x: window.innerWidth / 2, y: window.innerHeight / 2 };
                const mouse = { x: pos.x, y: pos.y };
                const speed = 0.15;
                const xSet = gsap.quickSetter(cursor, "x", "px");
                const ySet = gsap.quickSetter(cursor, "y", "px");
                window.addEventListener('mousemove', e => {
                    mouse.x = e.x;
                    mouse.y = e.y;
                });
                gsap.ticker.add(() => {
                    const dt = 1.0 - Math.pow(1.0 - speed, gsap.ticker.deltaRatio());
                    pos.x += (mouse.x - pos.x) * dt;
                    pos.y += (mouse.y - pos.y) * dt;
                    xSet(pos.x);
                    ySet(pos.y);
                });
                interactiveElements.forEach(el => {
                    el.addEventListener('mouseenter', () => cursor.classList.add('grow'));
                    el.addEventListener('mouseleave', () => cursor.classList.remove('grow'));
                });
            }

            const canvas = document.getElementById('ambient-canvas');
            if (canvas) {
                const ctx = canvas.getContext('2d');
                let particlesArray;
                canvas.width = window.innerWidth;
                canvas.height = window.innerHeight;
                const mouse = { x: null, y: null, radius: (canvas.height/120) * (canvas.width/120) }
                window.addEventListener('mousemove', function(event) {
                    mouse.x = event.x;
                    mouse.y = event.y;
                });
                class Particle {
                    constructor(x, y, directionX, directionY, size, color) {
                        this.x = x; this.y = y; this.directionX = directionX; this.directionY = directionY; this.size = size; this.color = color;
                    }
                    draw() {
                        ctx.beginPath();
                        ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2, false);
                        ctx.fillStyle = 'rgba(170, 170, 170, 0.5)';
                        ctx.fill();
                    }
                    update() {
                        if (this.x > canvas.width || this.x < 0) { this.directionX = -this.directionX; }
                        if (this.y > canvas.height || this.y < 0) { this.directionY = -this.directionY; }
                        this.x += this.directionX; this.y += this.directionY; this.draw();
                    }
                }
                function init() {
                    particlesArray = [];
                    let numberOfParticles = (canvas.height * canvas.width) / 9000;
                    for (let i = 0; i < numberOfParticles; i++) {
                        let size = (Math.random() * 2) + 1;
                        let x = (Math.random() * ((innerWidth - size * 2) - (size * 2)) + size * 2);
                        let y = (Math.random() * ((innerHeight - size * 2) - (size * 2)) + size * 2);
                        let directionX = (Math.random() * 0.4) - 0.2;
                        let directionY = (Math.random() * 0.4) - 0.2;
                        particlesArray.push(new Particle(x, y, directionX, directionY, size, 'rgba(170, 170, 170, 0.5)'));
                    }
                }
                function connect() {
                    let opacityValue = 1;
                    for (let a = 0; a < particlesArray.length; a++) {
                        for (let b = a; b < particlesArray.length; b++) {
                            let distance = ((particlesArray[a].x - particlesArray[b].x) * (particlesArray[a].x - particlesArray[b].x)) + ((particlesArray[a].y - particlesArray[b].y) * (particlesArray[a].y - particlesArray[b].y));
                            if (distance < (canvas.width/7) * (canvas.height/7)) {
                                opacityValue = 1 - (distance/20000);
                                ctx.strokeStyle = 'rgba(170, 170, 170, ' + opacityValue + ')';
                                ctx.lineWidth = 1;
                                ctx.beginPath();
                                ctx.moveTo(particlesArray[a].x, particlesArray[a].y);
                                ctx.lineTo(particlesArray[b].x, particlesArray[b].y);
                                ctx.stroke();
                            }
                        }
                    }
                }
                function animate() {
                    requestAnimationFrame(animate);
                    ctx.clearRect(0,0,innerWidth, innerHeight);
                    for (let i = 0; i < particlesArray.length; i++) { particlesArray[i].update(); }
                    connect();
                }
                window.addEventListener('resize', function() {
                    canvas.width = innerWidth;
                    canvas.height = innerHeight;
                    mouse.radius = ((canvas.height/120) * (canvas.width/120));
                    init();
                });
                window.addEventListener('mouseout', function() {
                    mouse.x = undefined;
                    mouse.y = undefined;
                });
                init();
                animate();
            }
        });
    </script>

</body>
</html>
